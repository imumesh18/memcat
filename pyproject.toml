[project]
name = "memcat"
version = "1.0.0"
description = "Clause-level text-to-speech cache for Pipecat voice bots."
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Umesh Yadav", email = "git@umesh.dev" }]
requires-python = ">=3.11"
keywords = ["pipecat", "tts", "text-to-speech", "cache", "voice", "voice-ai", "telephony"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Typing :: Typed",
]
dependencies = [
    "pipecat-ai>=1.10,<1.14",  # each Pipecat minor is tested before it is allowed
    # Imported directly by memcat; Pipecat 1.10 requires the same floors.
    "aiohttp>=3.11.12",
    "audioop-lts>=0.2.1; python_version >= '3.13'",
    "loguru>=0.7.3",
    "numpy>=1.26.4",
    "soxr>=1.0.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0.1"]
opus = ["av>=14"]
s3 = ["boto3>=1.34"]
all = ["memcat[redis,opus,s3]"]

[project.scripts]
memcat = "memcat.cli:main"

[project.urls]
Homepage = "https://github.com/imumesh18/memcat"
Source = "https://github.com/imumesh18/memcat"
Documentation = "https://github.com/imumesh18/memcat/tree/main/docs"
Changelog = "https://github.com/imumesh18/memcat/blob/main/CHANGELOG.md"
Issues = "https://github.com/imumesh18/memcat/issues"

[dependency-groups]
asr = [
    "faster-whisper>=1.2.1",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "redis>=5.0.1",
    "av>=14",
    "boto3>=1.34",
    "moto[s3]>=5",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "pipecat-ai[kokoro]>=1.13.0,<1.14",
    "psutil>=7.2.2",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
# Ruff also formats Python blocks in Markdown; the docs keep hand-aligned comments.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PERF", "S"]
ignore = ["S101", "S311", "RUF012", "RUF001", "RUF002", "RUF003", "ASYNC109", "ASYNC110"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "PERF", "RUF", "ASYNC"]
"bench/**" = ["S", "PERF", "RUF", "ASYNC"]
"examples/**" = ["S"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportMissingParameterType = false
reportPrivateUsage = false
reportUnnecessaryIsInstance = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["memcat"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
